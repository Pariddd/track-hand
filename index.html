<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />
    <title>DILLA & FARID</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #000000;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      /* Canvas Three.js — layer paling atas, transparan agar video di baliknya (jika dipakai) tetap hitam pekat */
      #three-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      /* ===== Kamera (HUD kiri bawah) =====
         <video> tetap sumber frame MediaPipe; CSS hanya mengubah tampilannya, bukan frame-nya.
         Elemen khas: warna bingkai mengikuti bentuk partikel yang aktif (--cam-accent di-set
         dari src/ui/CameraHud.js). Saat tangan belum terlihat, video meredup & titik berdenyut. */
      .cam {
        --cam-accent: #b89eff;
        --cam-w: 232px;
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 15;
        width: var(--cam-w);
        color: var(--music-frost);
      }

      .cam__frame {
        position: relative;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border-radius: 18px;
        background: #05080d;
        border: 1.5px solid
          color-mix(in srgb, var(--cam-accent) 65%, transparent);
        box-shadow:
          0 0 0 4px color-mix(in srgb, var(--cam-accent) 14%, transparent),
          0 12px 32px rgba(0, 0, 0, 0.55);
        transition:
          border-color 0.6s ease,
          box-shadow 0.6s ease;
      }

      #camera-video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(
          -1
        ); /* mirror selfie-view; hanya tampilan, MediaPipe membaca frame asli */
        transition: filter 0.4s ease;
      }

      .cam[data-presence="none"] #camera-video {
        filter: saturate(0.35) brightness(0.6);
      }

      .cam__dot {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cam-accent);
        box-shadow: 0 0 0 3px rgba(5, 8, 13, 0.55);
        transition: background-color 0.6s ease;
      }

      .cam[data-presence="none"] .cam__dot {
        background: var(--music-mist);
        animation: cam-search 1.6s ease-in-out infinite;
      }

      .cam[data-state="error"] .cam__dot {
        background: #ff6b6b;
        animation: none;
      }

      @keyframes cam-search {
        50% {
          opacity: 0.25;
        }
      }

      /* Baris 1: ikon + nama bentuk + tombol. Baris 2: status tangan, memakai lebar penuh. */
      .cam__bar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        column-gap: 10px;
        row-gap: 3px;
        margin-top: 10px;
        padding: 8px 8px 8px 12px;
        border-radius: 16px;
        background: var(--music-glass);
        border: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }

      .cam__glyph {
        grid-column: 1;
        grid-row: 1 / 3;
        --glyph-accent: var(--cam-accent);
      }

      .cam__now {
        display: contents;
      }

      .cam__shape {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
        font-family: "Caveat", "Segoe Script", cursive;
        font-weight: 600;
        font-size: 22px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cam__hint {
        grid-column: 2 / 4;
        grid-row: 2;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--music-mist);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cam[data-presence="none"] .cam__hint {
        color: var(--music-blush);
      }

      .cam[data-state="error"] .cam__hint {
        color: #ff9b9b;
        white-space: normal;
      }

      .cam__toggle {
        grid-column: 3;
        grid-row: 1;
        padding: 7px 11px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: transparent;
        color: var(--music-frost);
        font: inherit;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }

      .cam__toggle:hover,
      .cam[data-guide="open"] .cam__toggle {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.24);
      }

      .cam__toggle:focus-visible {
        outline: 2px solid var(--cam-accent);
        outline-offset: 2px;
      }

      .cam[data-state="error"] .cam__toggle,
      .cam[data-state="error"] .cam__glyph {
        display: none;
      }

      /* Ikon gerakan: 5 batang jari (jempol → kelingking). Batang naik = jari terbuka. */
      .fingers {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 18px;
      }

      .fingers i {
        width: 3px;
        height: 5px;
        border-radius: 2px;
        background: color-mix(
          in srgb,
          var(--glyph-accent, var(--music-mist)) 40%,
          rgba(159, 182, 199, 0.25)
        );
      }

      .fingers i.up {
        background: var(--glyph-accent, var(--music-frost));
      }
      .fingers i.up:nth-child(1) {
        height: 10px;
      }
      .fingers i.up:nth-child(2) {
        height: 16px;
      }
      .fingers i.up:nth-child(3) {
        height: 18px;
      }
      .fingers i.up:nth-child(4) {
        height: 16px;
      }
      .fingers i.up:nth-child(5) {
        height: 12px;
      }

      /* Panduan gerakan: muncul di atas kamera, tidak menggeser kamera */
      .guide {
        position: absolute;
        left: 0;
        bottom: calc(100% + 12px);
        width: 272px;
        padding: 14px 10px 8px;
        border-radius: 18px;
        background: rgba(6, 12, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        max-height: calc(100vh - 330px);
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        transform: translateY(8px);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          visibility 0s linear 0.25s;
      }

      .cam[data-guide="open"] .guide {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }

      .guide__title {
        padding: 0 6px;
        font-family: "Caveat", "Segoe Script", cursive;
        font-weight: 600;
        font-size: 24px;
        line-height: 1;
      }

      .guide__note {
        margin: 4px 0 8px;
        padding: 0 6px;
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--music-mist);
      }

      .guide__list {
        list-style: none;
      }

      .guide__row {
        --glyph-accent: var(--row-accent);
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 7px 6px;
        border-radius: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .guide__gesture {
        font-size: 12px;
        color: var(--music-mist);
      }

      .guide__result {
        font-family: "Caveat", "Segoe Script", cursive;
        font-weight: 600;
        font-size: 19px;
        line-height: 1;
        text-align: right;
      }

      .guide__row[aria-current="true"] {
        border-top-color: transparent;
        background: color-mix(in srgb, var(--row-accent) 13%, transparent);
      }

      .guide__row[aria-current="true"] + .guide__row {
        border-top-color: transparent;
      }

      .guide__row[aria-current="true"] .guide__gesture {
        color: var(--music-frost);
      }

      .guide__row[aria-current="true"] .guide__result {
        color: var(--row-accent);
      }

      @media (max-width: 520px) {
        .cam {
          --cam-w: 136px;
          bottom: 12px;
          left: 12px;
        }

        .cam__frame {
          border-radius: 14px;
        }

        .cam__bar {
          width: calc(100vw - 24px);
          max-width: 300px;
        }

        .guide {
          width: calc(100vw - 24px);
          max-width: 320px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cam__frame,
        .cam__dot,
        .guide,
        .cam[data-guide="open"] .guide,
        #camera-video {
          transition: none;
        }

        .cam[data-presence="none"] .cam__dot {
          animation: none;
        }
      }

      /* ===== Pemutar musik =====
         Kapsul kaca di pojok kanan atas. Elemen khas: piringan titik yang berputar saat lagu
         jalan dan berpendar mengikuti bass (--level di-set dari AudioPlayer.js, 0..1). */
      :root {
        --music-glass: rgba(6, 12, 20, 0.62);
        --music-cyan: #4de1ff;
        --music-blush: #ff8fc1;
        --music-frost: #eef7ff;
        --music-mist: #9fb6c7;
      }

      .music {
        --level: 0;
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 25;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 300px;
        padding: 10px 20px 10px 10px;
        border-radius: 999px;
        background: var(--music-glass);
        border: 1px solid rgba(77, 225, 255, 0.22);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        color: var(--music-frost);
      }

      .music__toggle {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        color: var(--music-frost);
        background: radial-gradient(
          circle,
          rgba(255, 143, 193, 0.18),
          transparent 68%
        );
        box-shadow:
          0 0 calc(4px + var(--level) * 28px)
            rgba(255, 143, 193, calc(0.12 + var(--level) * 0.6)),
          inset 0 0 0 1px rgba(77, 225, 255, 0.16);
        transform: scale(calc(1 + var(--level) * 0.08));
        transition:
          transform 90ms linear,
          background-color 150ms ease;
      }

      .music__toggle:hover:not(:disabled) {
        background-color: rgba(255, 255, 255, 0.05);
      }

      .music__toggle:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      /* Cincin 24 titik-garis (pecahan partikel), di-mask jadi annulus tipis di tepi */
      .music__disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: repeating-conic-gradient(
          var(--music-cyan) 0deg 4deg,
          transparent 4deg 15deg
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 4.5px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 4.5px)
        );
        animation: music-spin 8s linear infinite;
        animation-play-state: paused;
      }

      .music[data-state="playing"] .music__disc {
        animation-play-state: running;
      }

      @keyframes music-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .music__icon {
        position: relative;
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .music__icon--pause,
      .music[data-state="playing"] .music__icon--play {
        display: none;
      }

      .music[data-state="playing"] .music__icon--pause {
        display: block;
      }

      .music__body {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 3px;
      }

      .music__title {
        font-family: "Caveat", "Segoe Script", cursive;
        font-weight: 600;
        font-size: 23px;
        line-height: 1;
        color: var(--music-frost);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .music__meta,
      .music__hint {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .music__meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--music-mist);
      }

      .music__artist {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .music__time {
        flex: none;
        font-variant-numeric: tabular-nums;
      }

      .music__hint {
        display: none;
        color: var(--music-blush);
      }

      .music[data-state="idle"] .music__hint,
      .music[data-state="error"] .music__hint {
        display: block;
      }

      .music[data-state="idle"] .music__meta,
      .music[data-state="idle"] .music__progress,
      .music[data-state="error"] .music__meta,
      .music[data-state="error"] .music__progress {
        display: none;
      }

      /* Progress bar (input range) — bisa digeser untuk lompat posisi lagu */
      .music__progress {
        --progress: 0%;
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 14px;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }

      .music__progress:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .music__progress::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          var(--music-blush) var(--progress),
          rgba(159, 182, 199, 0.28) var(--progress)
        );
      }

      .music__progress::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        margin-top: -3.5px;
        border-radius: 50%;
        background: var(--music-frost);
        box-shadow: 0 0 0 3px rgba(255, 143, 193, 0.35);
      }

      .music__progress::-moz-range-track {
        height: 3px;
        border-radius: 3px;
        background: rgba(159, 182, 199, 0.28);
      }

      .music__progress::-moz-range-progress {
        height: 3px;
        border-radius: 3px;
        background: var(--music-blush);
      }

      .music__progress::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border: 0;
        border-radius: 50%;
        background: var(--music-frost);
        box-shadow: 0 0 0 3px rgba(255, 143, 193, 0.35);
      }

      .music__toggle:focus-visible,
      .music__progress:focus-visible {
        outline: 2px solid var(--music-blush);
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        .music {
          top: 12px;
          right: 12px;
          left: 12px;
          width: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .music__disc {
          animation: none;
        }

        .music__toggle {
          transform: none;
          transition: none;
        }
      }

      #loading-overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        color: #4de1ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        letter-spacing: 0.1em;
        transition: opacity 0.5s ease;
      }

      #loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #permission-error {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: rgba(0, 0, 0, 0.95);
        color: #ff6b6b;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="three-canvas"></canvas>
      <section
        id="camera-hud"
        class="cam"
        data-state="loading"
        data-presence="none"
        data-guide="closed"
        aria-label="Kamera"
      >
        <div class="guide" id="cam-guide" data-cam-guide>
          <p class="guide__title">Gerakan tangan</p>
          <p class="guide__note">
            Tahan gerakan sebentar sampai partikelnya berubah.
          </p>
          <ul class="guide__list" data-cam-list></ul>
        </div>
        <div class="cam__frame">
          <video id="camera-video" playsinline autoplay muted></video>
          <span class="cam__dot" aria-hidden="true"></span>
        </div>
        <div class="cam__bar">
          <span class="cam__glyph" data-cam-glyph role="img"></span>
          <div class="cam__now" aria-live="polite">
            <p class="cam__shape" data-cam-shape></p>
            <p class="cam__hint" data-cam-hint>Menyiapkan kamera</p>
          </div>
          <button
            class="cam__toggle"
            type="button"
            data-cam-toggle
            aria-controls="cam-guide"
            aria-expanded="false"
          >
            <span data-cam-toggle-label>Gerakan</span>
          </button>
        </div>
      </section>
      <section
        id="music-player"
        class="music"
        data-state="idle"
        aria-label="Pemutar musik"
      >
        <button
          class="music__toggle"
          type="button"
          data-music-toggle
          aria-label="Putar lagu"
        >
          <span class="music__disc" aria-hidden="true"></span>
          <svg
            class="music__icon music__icon--play"
            viewBox="0 0 16 16"
            aria-hidden="true"
          >
            <path
              d="M4.5 2.6v10.8a.6.6 0 0 0 .92.5l8.4-5.4a.6.6 0 0 0 0-1L5.42 2.1a.6.6 0 0 0-.92.5z"
            />
          </svg>
          <svg
            class="music__icon music__icon--pause"
            viewBox="0 0 16 16"
            aria-hidden="true"
          >
            <rect x="3.5" y="2.5" width="3" height="11" rx="1" />
            <rect x="9.5" y="2.5" width="3" height="11" rx="1" />
          </svg>
        </button>
        <div class="music__body">
          <p class="music__title" data-music-title>Judul Lagu</p>
          <p class="music__meta">
            <span class="music__artist" data-music-artist>Nama Penyanyi</span>
            <span class="music__time" data-music-time>0:00 / 0:00</span>
          </p>
          <input
            class="music__progress"
            type="range"
            min="0"
            max="1000"
            step="1"
            value="0"
            disabled
            data-music-progress
            aria-label="Posisi lagu"
          />
          <p class="music__hint" data-music-hint aria-live="polite"></p>
        </div>
      </section>
      <div id="loading-overlay">SABAR YAA DILLA CANTIK LAGI LOADING...</div>
      <div id="permission-error">
        Akses kamera ditolak atau tidak tersedia.<br />
        Pastikan browser memiliki izin kamera
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
